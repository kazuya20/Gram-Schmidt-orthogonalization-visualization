<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>リアクティブ線形代数</title>
<style>
/* レイアウト：目次 → 各可視化。グラム・シュミットの見た目（落ち着いた生成り＋4色の役割色）を全ページで共有する */
:root{
  --text-primary:#2c2c2a;
  --text-secondary:#6b6a64;
  --text-success:#1D9E75;
  --surface-0:#ffffff;
  --surface-1:#f4f3ef;
  --border:#d3d1c7;
  --grid:#e4e2da;
  --c-v:#9C9A92;   /* 元のもの */
  --c-a:#7F77DD;   /* A 側 */
  --c-b:#D85A30;   /* B 側 */
  --c-w:#1D9E75;   /* いま動いているもの・積 */
  --font-sans:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --text-primary:#ecebe6;--text-secondary:#a9a79f;--text-success:#5DCAA5;
    --surface-0:#1c1c1a;--surface-1:#2a2a27;--border:#45443f;--grid:#363531;
    --c-v:#8d8b83;--c-a:#A39CF0;--c-b:#EE8058;--c-w:#4FC79C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --text-primary:#ecebe6;--text-secondary:#a9a79f;--text-success:#5DCAA5;
  --surface-0:#1c1c1a;--surface-1:#2a2a27;--border:#45443f;--grid:#363531;
  --c-v:#8d8b83;--c-a:#A39CF0;--c-b:#EE8058;--c-w:#4FC79C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0 auto;max-width:820px;padding-inline:16px;padding-block:16px;
  font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-0);
}
button{
  display:inline-flex;align-items:center;gap:4px;padding:6px 10px;
  font:inherit;font-size:14px;color:var(--text-primary);
  background:var(--surface-1);border:1px solid var(--border);border-radius:8px;cursor:pointer;
}
button:hover{filter:brightness(0.96)}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--c-a);outline-offset:2px}
button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=range]{accent-color:var(--c-a)}
.row{display:flex;align-items:center;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.lab{font-size:14px;color:var(--text-secondary)}
.mono{font-family:var(--font-mono);font-size:14px;line-height:1.9;overflow-x:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary);margin:10px 0 4px}
.stage{width:100%;height:380px;border-radius:12px;background:var(--surface-1);touch-action:none;display:block}
.topbar{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.topbar h1{font-size:17px;font-weight:600;margin:0}
.ok{color:var(--text-success)}
.note{font-size:14px;color:var(--text-secondary);line-height:1.8;margin:0 0 12px;max-width:65ch}

/* 目次 */
#home{padding-block:12vh 0}
#home h1{font-size:30px;font-weight:600;letter-spacing:0.02em;margin:0 0 28px}
.menu{display:flex;flex-direction:column;gap:10px;max-width:360px}
.menu button{justify-content:space-between;padding:14px 16px;font-size:16px}

/* 連鎖の表示 */
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;font-family:var(--font-mono);font-size:15px}
.chain .node{padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--text-secondary)}
.chain .node.on{color:var(--c-w);border-color:var(--c-w)}
.chain .chip{padding:3px 10px;border-radius:6px;background:var(--surface-1);border:1px solid var(--border)}
.chain .chip.a{color:var(--c-a)} .chain .chip.b{color:var(--c-b)}
.chain .chip.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.chain .arr{color:var(--text-secondary)}
</style>

<!-- 目次 -->
<section id="home">
  <h1>リアクティブ線形代数</h1>
  <div class="menu">
    <button id="go-gs">グラム・シュミットの正規直交化 <span aria-hidden="true">→</span></button>
    <button id="go-it">逆行列と転置 <span aria-hidden="true">→</span></button>
  </div>
</section>

<!-- グラム・シュミット -->
<section id="gs" hidden>
  <div class="topbar">
    <button class="back" aria-label="目次へ戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>目次</button>
    <h1>グラム・シュミットの正規直交化</h1>
  </div>
  <div style="padding:1rem 0 0">
    <div class="row">
      <button id="prev" aria-label="前のステップ"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <span id="stepname" style="font-size:15px;font-weight:500;flex:1;min-width:0">ステップ 1：u₁ := v₁</span>
      <button id="next" aria-label="次のステップ"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button id="rand"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg> ベクトルを変える</button>
    </div>
    <div class="row" id="rowa" hidden>
      <span class="lab" style="min-width:150px">u₁ 方向を引く量</span>
      <input type="range" id="a" min="0" max="1" step="0.01" value="0" style="flex:1">
      <span id="aout" style="font-size:14px;font-weight:500;min-width:40px;text-align:right">0.00</span>
    </div>
    <div class="row" id="rowb" hidden>
      <span class="lab" style="min-width:150px">u₂ 方向を引く量</span>
      <input type="range" id="b" min="0" max="1" step="0.01" value="0" style="flex:1">
      <span id="bout" style="font-size:14px;font-weight:500;min-width:40px;text-align:right">0.00</span>
    </div>
    <div id="view" class="stage" style="cursor:grab"></div>
    <div class="legend">
      <span><span class="sw" style="background:#B4B2A9"></span>元の v</span>
      <span><span class="sw" style="background:#7F77DD"></span>確定した u</span>
      <span><span class="sw" style="background:#D85A30"></span>正射影（引く成分）</span>
      <span><span class="sw" style="background:#1D9E75"></span>作っている途中のベクトル w</span>
    </div>
    <div class="mono" id="read"></div>
  </div>
</section>

<!-- 逆行列と転置 -->
<section id="it" hidden>
  <div class="topbar">
    <button class="back" aria-label="目次へ戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>目次</button>
    <h1>逆行列と転置</h1>
  </div>
  <div style="padding:1rem 0 0">
    <div class="row">
      <button id="it-prev" aria-label="前のステップ"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <span id="it-stepname" style="font-size:15px;font-weight:500;flex:1;min-width:0"></span>
      <button id="it-next" aria-label="次のステップ"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button id="it-rand"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg> 行列を変える</button>
    </div>
    <p class="note" id="it-note"></p>
    <div class="chain" id="it-chain"></div>
    <div class="row">
      <span class="lab" style="min-width:150px" id="it-lab"></span>
      <input type="range" id="it-s" min="0" max="2" step="0.01" value="0" style="flex:1">
      <span id="it-sout" style="font-size:14px;font-weight:500;min-width:40px;text-align:right">0.00</span>
    </div>
    <canvas id="it-cv" class="stage" tabindex="0" aria-label="行列の変換の図"></canvas>
    <div class="legend" id="it-legend"></div>
    <div class="mono" id="it-read"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- ページ切り替え ---------- */
const pages={home:document.getElementById('home'),'gram-schmidt':document.getElementById('gs'),'inverse-transpose':document.getElementById('it')};
function go(name){
  if(!pages[name])name='home';
  for(const k in pages)pages[k].hidden=(k!==name);
  try{history.replaceState(null,'',name==='home'?location.pathname+location.search:'#'+name);}catch(e){}
  window.scrollTo(0,0);
  if(name==='gram-schmidt')requestAnimationFrame(initGS);
  if(name==='inverse-transpose')requestAnimationFrame(IT.show);
}
document.getElementById('go-gs').onclick=()=>go('gram-schmidt');
document.getElementById('go-it').onclick=()=>go('inverse-transpose');
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>go('home'));

/* ---------- グラム・シュミット（元の実装をそのまま、表示されたときに初期化） ---------- */
let gsReady=false,gsResize=()=>{};
function initGS(){
if(gsReady){gsResize();return;}gsReady=true;
const el=document.getElementById('view');const W=()=>el.clientWidth,H=()=>el.clientHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(W(),H());el.appendChild(renderer.domElement);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(40,W()/H(),0.1,100);
let th=0.7,ph=1.1,R=9;
function place(){cam.position.set(R*Math.sin(ph)*Math.cos(th),R*Math.cos(ph),R*Math.sin(ph)*Math.sin(th));cam.lookAt(0.6,0.5,-0.4);}
const V=a=>new THREE.Vector3(a[0],a[2],-a[1]);
const add=(p,q)=>p.map((x,i)=>x+q[i]),sub=(p,q)=>p.map((x,i)=>x-q[i]),sc=(p,s)=>p.map(x=>x*s),dot=(p,q)=>p[0]*q[0]+p[1]*q[1]+p[2]*q[2];
const proj=(v,u)=>sc(u,dot(u,v)/dot(u,u));
[[3,0,0],[0,3,0],[0,0,3]].forEach(t=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),V(t)]);scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xD3D1C7})));});
function mkArrow(col){const a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,col,0.25,0.14);a.line.material.linewidth=2;scene.add(a);return a;}
function mkLabel(t,col){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');x.fillStyle=col;x.font='500 40px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,64,32);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(0.7,0.35,1);scene.add(s);return s;}
function setA(ar,from,vec,lb){const len=Math.hypot(...vec);if(len<1e-3){ar.visible=false;if(lb)lb.visible=false;return;}ar.visible=true;ar.position.copy(V(from));ar.setDirection(V(vec).normalize());ar.setLength(len,Math.min(0.25,len*0.4),Math.min(0.14,len*0.25));if(lb){lb.visible=true;lb.position.copy(V(add(from,sc(vec,1.12))));}}
function hide(...xs){xs.forEach(x=>x.visible=false);}
const G=0x9C9A92,P=0x7F77DD,C=0xD85A30,T=0x1D9E75;
const aV=[mkArrow(G),mkArrow(G),mkArrow(G)],lV=[mkLabel('v₁','#888780'),mkLabel('v₂','#888780'),mkLabel('v₃','#888780')];
const aU=[mkArrow(P),mkArrow(P),mkArrow(P)],lU=[mkLabel('u₁','#7F77DD'),mkLabel('u₂','#7F77DD'),mkLabel('u₃','#7F77DD')];
const aP1=mkArrow(C),aP2=mkArrow(C),aS1=mkArrow(C),aS2=mkArrow(C),aW=mkArrow(T),lW=mkLabel('w','#1D9E75');
const lP1=mkLabel('射影','#D85A30'),lP2=mkLabel('射影','#D85A30');
let v=[[2.2,0.3,0.2],[1.3,1.9,0.4],[1.0,0.9,1.9]];
let step=0;const names=['ステップ 1：u₁ := v₁','ステップ 2：v₂ から u₁ 方向を引いて u₂','ステップ 3：v₃ から u₁, u₂ 方向を引いて u₃','完成：u₁, u₂, u₃ は互いに直交'];
const as=document.getElementById('a'),bs=document.getElementById('b'),rd=document.getElementById('read');
const f=x=>{const r=Math.abs(x)<0.005?0:x;return (r<0?'−':'')+Math.abs(r).toFixed(2);};
const ok=x=>Math.abs(x)<0.005?' <span class="ok">直交</span>':'';
function upd(){
const a=parseFloat(as.value),b=parseFloat(bs.value);document.getElementById('aout').textContent=a.toFixed(2);document.getElementById('bout').textContent=b.toFixed(2);
const u1=v[0],u2=sub(v[1],proj(v[1],u1)),u3=sub(sub(v[2],proj(v[2],u1)),proj(v[2],u2));
document.getElementById('stepname').textContent=names[step];
document.getElementById('rowa').hidden=!(step===1||step===2);
document.getElementById('rowb').hidden=step!==2;
hide(aP1,aP2,aS1,aS2,aW,lW,lP1,lP2,...aU,...lU,...aV,...lV);
const O=[0,0,0];let h='';
if(step===0){setA(aU[0],O,u1,lU[0]);setA(aV[1],O,v[1],lV[1]);setA(aV[2],O,v[2],lV[2]);h='u₁ はそのまま v₁。これが基準の方向になる。';}
if(step===1){const p=proj(v[1],u1);const w=sub(v[1],sc(p,a));setA(aU[0],O,u1,lU[0]);setA(aV[1],O,v[1],lV[1]);setA(aP1,O,p,lP1);setA(aS1,v[1],sc(p,-a));setA(aW,O,w,lW);
h='w = v₂ − '+a.toFixed(2)+' × (u₁·v₂ / u₁·u₁) u₁<br>u₁ · w = '+f(dot(u1,w))+ok(dot(u1,w));}
if(step===2){const p1=proj(v[2],u1),p2=proj(v[2],u2);const m=sub(v[2],sc(p1,a));const w=sub(m,sc(p2,b));
setA(aU[0],O,u1,lU[0]);setA(aU[1],O,u2,lU[1]);setA(aV[2],O,v[2],lV[2]);setA(aP1,O,p1,lP1);setA(aP2,O,p2,lP2);setA(aS1,v[2],sc(p1,-a));setA(aS2,m,sc(p2,-b));setA(aW,O,w,lW);
h='w = v₃ − '+a.toFixed(2)+' × (u₁ 方向の射影) − '+b.toFixed(2)+' × (u₂ 方向の射影)<br>u₁ · w = '+f(dot(u1,w))+ok(dot(u1,w))+'<br>u₂ · w = '+f(dot(u2,w))+ok(dot(u2,w));}
if(step===3){setA(aU[0],O,u1,lU[0]);setA(aU[1],O,u2,lU[1]);setA(aU[2],O,u3,lU[2]);
h='u₁ · u₂ = '+f(dot(u1,u2))+ok(dot(u1,u2))+'<br>u₁ · u₃ = '+f(dot(u1,u3))+ok(dot(u1,u3))+'<br>u₂ · u₃ = '+f(dot(u2,u3))+ok(dot(u2,u3));}
rd.innerHTML=h;}
as.oninput=upd;bs.oninput=upd;
document.getElementById('next').onclick=()=>{step=Math.min(3,step+1);as.value=0;bs.value=0;upd();};
document.getElementById('prev').onclick=()=>{step=Math.max(0,step-1);as.value=0;bs.value=0;upd();};
document.getElementById('rand').onclick=()=>{const r=()=>Math.round((Math.random()*2.4-0.4)*10)/10;v=[[1.6+Math.random(),r()*0.5,r()*0.5],[r(),1.4+Math.random()*0.8,r()*0.6],[r(),r(),1.4+Math.random()*0.8]];as.value=0;bs.value=0;upd();};
let drag=false,lx=0,ly=0;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing';});
el.addEventListener('pointerup',()=>{drag=false;el.style.cursor='grab';});
el.addEventListener('pointermove',e=>{if(!drag)return;th+=(e.clientX-lx)*0.01;ph=Math.min(3.0,Math.max(0.15,ph-(e.clientY-ly)*0.01));lx=e.clientX;ly=e.clientY;});
gsResize=()=>{if(!W())return;renderer.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix();};
window.addEventListener('resize',gsResize);
function loop(){requestAnimationFrame(loop);place();renderer.render(scene,cam);}
upd();loop();
}

/* ---------- 逆行列と転置 ---------- */
const IT=(()=>{
  // 2×2 行列の道具
  const mul=(X,Y)=>[[X[0][0]*Y[0][0]+X[0][1]*Y[1][0],X[0][0]*Y[0][1]+X[0][1]*Y[1][1]],[X[1][0]*Y[0][0]+X[1][1]*Y[1][0],X[1][0]*Y[0][1]+X[1][1]*Y[1][1]]];
  const tr=X=>[[X[0][0],X[1][0]],[X[0][1],X[1][1]]];
  const det=X=>X[0][0]*X[1][1]-X[0][1]*X[1][0];
  const inv=X=>{const d=det(X);return[[X[1][1]/d,-X[0][1]/d],[-X[1][0]/d,X[0][0]/d]];};
  const I=[[1,0],[0,1]];
  const lerp=(X,Y,t)=>X.map((r,i)=>r.map((v,j)=>v+(Y[i][j]-v)*t));
  const ap=(M,p)=>[M[0][0]*p[0]+M[0][1]*p[1],M[1][0]*p[0]+M[1][1]*p[1]];
  const same=(X,Y)=>X.every((r,i)=>r.every((v,j)=>Math.abs(v-Y[i][j])<1e-9));
  const fmt=x=>{let r=Math.abs(x)<1e-9?0:x;const s=Math.abs(r-Math.round(r))<1e-9?String(Math.abs(Math.round(r))):Math.abs(r).toFixed(2);return(r<0?'−':'')+s;};
  const fM=X=>'['+fmt(X[0][0])+'  '+fmt(X[0][1])+' ; '+fmt(X[1][0])+'  '+fmt(X[1][1])+']';
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  let A=[[0,-1],[1,1]],B=[[1,1],[0,1]];
  let step=0,sel=[0,1],view=null;
  const F=[[0,0],[0.3,0],[0.3,0.6],[0.75,0.6],[0.75,0.85],[0.3,0.85],[0.3,1.1],[1,1.1],[1,1.4],[0,1.4]];

  const $=id=>document.getElementById(id);
  const cv=$('it-cv'),sIn=$('it-s');

  const names=['ステップ 1：行列積は右から左へ働く（ABx）','ステップ 2：逆行列は左から右へ戻る（(AB)⁻¹ = B⁻¹A⁻¹）','ステップ 3：転置は軸の入れ替え（(AB)ᵗ = BᵗAᵗ）','ステップ 4：(A⁻¹)ᵗ = (Aᵗ)⁻¹'];
  const notes=[
    'ABx では x に近い B が先に働く。式の右端から左へ、x → Bx → ABx と運ばれる。',
    '戻るときは同じ道を逆にたどる。左端の ABx から出発して、まず A を外し、次に B を外す。式に書くと先に働く A⁻¹ が右に来るので、B⁻¹A⁻¹ になる。',
    '左の行列 × 上の行列 = 交わる所の積、という配置で描く。図全体を対角線で裏返すと、行と列が入れ替わる。すると左にいた A は上へ、上にいた B は左へ移る。だから順番が逆になる。',
    'A⁻¹ × A = I をステップ 3 と同じ配置で描く。裏返すと Aᵗ × (A⁻¹)ᵗ = Iᵗ = I になる。つまり (A⁻¹)ᵗ は Aᵗ を戻す行列である。'
  ];

  function size(){
    const d=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d);}
    const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return[c,w,h];
  }
  function computeView(){
    let R=1.5;
    for(const M of [I,B,mul(A,B)])for(const p of F.concat([[1,0],[0,1]])){const q=ap(M,p);R=Math.max(R,Math.abs(q[0]),Math.abs(q[1]));}
    view=R*1.15;
  }

  /* ステップ 1・2：平面上の変換 */
  function drawPlane(M){
    const[c,w,h]=size();c.clearRect(0,0,w,h);
    const k=Math.min(w,h)/2/view,ox=w/2,oy=h/2;
    const P=p=>[ox+p[0]*k,oy-p[1]*k];
    // 目盛り
    c.lineWidth=1;c.strokeStyle=css('--grid');
    const n=Math.ceil(Math.max(w,h)/2/k);
    for(let i=-n;i<=n;i++){c.beginPath();c.moveTo(ox+i*k,0);c.lineTo(ox+i*k,h);c.stroke();c.beginPath();c.moveTo(0,oy-i*k);c.lineTo(w,oy-i*k);c.stroke();}
    c.strokeStyle=css('--border');c.beginPath();c.moveTo(0,oy);c.lineTo(w,oy);c.moveTo(ox,0);c.lineTo(ox,h);c.stroke();
    const shape=(N,col,fill,dash,lw)=>{c.beginPath();F.forEach((p,i)=>{const q=P(ap(N,p));i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});c.closePath();
      if(fill){c.globalAlpha=0.18;c.fillStyle=col;c.fill();c.globalAlpha=1;}c.setLineDash(dash||[]);c.lineWidth=lw||1.5;c.strokeStyle=col;c.stroke();c.setLineDash([]);};
    const label=(N,t,col)=>{const q=P(ap(N,[1.05,1.5]));c.fillStyle=col;c.font='500 14px '+css('--font-sans');c.textAlign='left';c.textBaseline='bottom';c.fillText(t,q[0]+4,q[1]);};
    const AB=mul(A,B);
    shape(I,css('--c-v'),false,[]);label(I,'x',css('--c-v'));
    shape(B,css('--c-b'),false,[5,4]);label(B,'Bx',css('--c-b'));
    shape(AB,css('--c-a'),false,[5,4]);label(AB,'ABx',css('--c-a'));
    const g=css('--c-w');shape(M,g,true,[],2.2);
    // 基底の行き先
    const arrow=(v,col)=>{const o=P([0,0]),e=P(v);const L=Math.hypot(e[0]-o[0],e[1]-o[1]);if(L<2)return;const ang=Math.atan2(e[1]-o[1],e[0]-o[0]);
      c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2;c.beginPath();c.moveTo(o[0],o[1]);c.lineTo(e[0],e[1]);c.stroke();
      c.beginPath();c.moveTo(e[0],e[1]);c.lineTo(e[0]-10*Math.cos(ang-0.4),e[1]-10*Math.sin(ang-0.4));c.lineTo(e[0]-10*Math.cos(ang+0.4),e[1]-10*Math.sin(ang+0.4));c.closePath();c.fill();};
    arrow(ap(M,[1,0]),g);arrow(ap(M,[0,1]),g);
  }

  /* ステップ 3・4：左 × 上 = 積 の配置を対角線で裏返す */
  let geom=null;
  function flip(p,t){const m=(p[0]+p[1])/2,cs=Math.cos(Math.PI*t);return[m+cs*(p[0]-m),m+cs*(p[1]-m)];}
  function drawFlip(t){
    const[c,w,h]=size();c.clearRect(0,0,w,h);
    const s=Math.min(w,h)/6.4,g=0.3*s,ox=w/2+g/2,oy=h/2+g/2;
    const S=p=>[ox+p[0],oy+p[1]];
    const after=t>=0.5,cs=Math.abs(Math.cos(Math.PI*t));
    let blocks;
    if(step===2){
      blocks=[
        {M:A,x0:-2*s-g,y0:0,col:css('--c-a'),pre:'A',post:'Aᵗ',lab:[-2*s-g-0.55*s,s]},
        {M:B,x0:0,y0:-2*s-g,col:css('--c-b'),pre:'B',post:'Bᵗ',lab:[s,-2*s-g-0.55*s]},
        {M:mul(A,B),x0:0,y0:0,col:css('--c-w'),pre:'AB',post:'(AB)ᵗ',lab:[2.6*s,2.6*s],prod:true}];
    }else{
      blocks=[
        {M:inv(A),x0:-2*s-g,y0:0,col:css('--c-b'),pre:'A⁻¹',post:'(A⁻¹)ᵗ',lab:[-2*s-g-0.55*s,s]},
        {M:A,x0:0,y0:-2*s-g,col:css('--c-a'),pre:'A',post:'Aᵗ',lab:[s,-2*s-g-0.55*s]},
        {M:I,x0:0,y0:0,col:css('--c-w'),pre:'I',post:'Iᵗ = I',lab:[2.6*s,2.6*s],prod:true}];
    }
    // 入れ替えの軸
    const L=3.4*s;const a1=S([-L,-L]),a2=S([L,L]);
    c.setLineDash([6,5]);c.strokeStyle=css('--text-secondary');c.lineWidth=1;c.beginPath();c.moveTo(a1[0],a1[1]);c.lineTo(a2[0],a2[1]);c.stroke();c.setLineDash([]);
    const fs=Math.max(12,s*0.26);
    geom=[];
    const [si,sk]=sel;
    blocks.forEach((bk,bi)=>{
      for(let r=0;r<2;r++)for(let q=0;q<2;q++){
        const x=bk.x0+q*s,y=bk.y0+r*s;
        const pts=[[x,y],[x+s,y],[x+s,y+s],[x,y+s]].map(p=>S(flip(p,t)));
        const hl=bk.prod?(r===si&&q===sk):(bi===0?r===si:q===sk);
        c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
        c.globalAlpha=hl?0.30:0.10;c.fillStyle=bk.col;c.fill();c.globalAlpha=1;
        c.lineWidth=hl?2.2:1;c.strokeStyle=hl?bk.col:css('--border');c.stroke();
        const ctr=S(flip([x+s/2,y+s/2],t));
        c.globalAlpha=Math.max(0.15,cs);c.fillStyle=css('--text-primary');c.font='500 '+fs+'px '+css('--font-mono');c.textAlign='center';c.textBaseline='middle';
        c.fillText(fmt(bk.M[r][q]),ctr[0],ctr[1]);c.globalAlpha=1;
        if(bk.prod)geom.push({r,q,ctr});
      }
      const lp=S(flip(bk.lab,t));
      c.globalAlpha=Math.max(0.2,cs);c.fillStyle=bk.col;c.font='600 '+Math.max(14,s*0.3)+'px '+css('--font-sans');c.textAlign='center';c.textBaseline='middle';
      c.fillText(after?bk.post:bk.pre,lp[0],lp[1]);c.globalAlpha=1;
    });
    // 位置の注記
    c.fillStyle=css('--text-secondary');c.font='12px '+css('--font-sans');c.textAlign='left';c.textBaseline='top';
    c.fillText('左 × 上 = 交わる所',10,10);
    const e=S([L*0.92,L*0.92]);c.textAlign='right';c.textBaseline='bottom';c.fillText('入れ替えの軸',e[0]-6,e[1]-6);
  }

  const dot3=(row,col)=>row.map((v,j)=>fmt(v)+'·'+fmt(col[j])).join(' + ');
  function update(){
    const s=parseFloat(sIn.value);$('it-sout').textContent=s.toFixed(2);
    $('it-stepname').textContent=names[step];$('it-note').textContent=notes[step];
    const AB=mul(A,B),Ai=inv(A),Bi=inv(B);
    let chain='',read='',legend='';
    if(step<2){
      $('it-lab').textContent=step===0?'右から運ぶ量':'左から戻る量';
      const pos=s<0.5?0:s<1.5?1:2;   // 0,1,2 = いまいる場所
      if(step===0){
        const on=i=>(2-i)===pos?' on':'';
        chain=`<span class="node${on(0)}">ABx</span><span class="arr">←</span><span class="chip a${s>1?' on':''}">A</span><span class="arr">←</span><span class="node${on(1)}">Bx</span><span class="arr">←</span><span class="chip b${s<=1?' on':''}">B</span><span class="arr">←</span><span class="node${on(2)}">x</span>`;
        const M=s<=1?lerp(I,B,s):mul(lerp(I,A,s-1),B);drawPlane(M);
        read=`A = ${fM(A)}　B = ${fM(B)}<br>AB = ${fM(AB)}<br>いま働いている行列：${s<=1?'B（右端の x に近いほう）':'A（B の結果に左から掛かる）'}`;
      }else{
        const on=i=>i===pos?' on':'';
        chain=`<span class="node${on(0)}">ABx</span><span class="arr">→</span><span class="chip a${s<=1?' on':''}">A⁻¹</span><span class="arr">→</span><span class="node${on(1)}">Bx</span><span class="arr">→</span><span class="chip b${s>1?' on':''}">B⁻¹</span><span class="arr">→</span><span class="node${on(2)}">x</span>`;
        const M=s<=1?mul(lerp(I,Ai,s),AB):mul(lerp(I,Bi,s-1),B);drawPlane(M);
        const chk=mul(mul(Bi,Ai),AB);
        read=`A⁻¹ = ${fM(Ai)}　B⁻¹ = ${fM(Bi)}<br>(AB)⁻¹ = B⁻¹A⁻¹ = ${fM(mul(Bi,Ai))}<br>B⁻¹A⁻¹ · AB = ${fM(chk)}${same(chk,I)?' <span class="ok">I に戻った</span>':''}`;
      }
      legend=`<span><span class="sw" style="background:var(--c-v)"></span>元の x</span><span><span class="sw" style="background:var(--c-b)"></span>Bx</span><span><span class="sw" style="background:var(--c-a)"></span>ABx</span><span><span class="sw" style="background:var(--c-w)"></span>いまの形</span>`;
      cv.style.cursor='default';
    }else{
      $('it-lab').textContent='軸を入れ替える量';
      drawFlip(s);
      const[i,k]=sel,after=s>=0.5;
      const L=step===2?A:inv(A),Tp=step===2?B:A,P=mul(L,Tp);
      const row=L[i],col=[Tp[0][k],Tp[1][k]];
      const ln=step===2?['A','B','AB']:['A⁻¹','A','A⁻¹A'];
      const lt=step===2?['Bᵗ','Aᵗ','(AB)ᵗ']:['Aᵗ','(A⁻¹)ᵗ','Aᵗ(A⁻¹)ᵗ'];
      if(!after){
        read=`${ln[2]} の (${i+1},${k+1}) 成分 = ${ln[0]} の ${i+1} 行 · ${ln[1]} の ${k+1} 列 = ${dot3(row,col)} = ${fmt(P[i][k])}`;
      }else{
        read=`${lt[2]} の (${k+1},${i+1}) 成分 = ${lt[0]} の ${k+1} 行 · ${lt[1]} の ${i+1} 列 = ${dot3(col,row)} = ${fmt(P[i][k])}`;
      }
      if(step===2){
        const l=tr(AB),r=mul(tr(B),tr(A));
        read+=`<br>(AB)ᵗ = ${fM(l)}　BᵗAᵗ = ${fM(r)}${same(l,r)?' <span class="ok">一致</span>':''}`;
        legend=`<span><span class="sw" style="background:var(--c-a)"></span>A 由来</span><span><span class="sw" style="background:var(--c-b)"></span>B 由来</span><span><span class="sw" style="background:var(--c-w)"></span>積</span>`;
      }else{
        const l=tr(Ai),r=inv(tr(A));
        read+=`<br>(A⁻¹)ᵗ = ${fM(l)}　(Aᵗ)⁻¹ = ${fM(r)}${same(l,r)?' <span class="ok">一致</span>':''}`;
        legend=`<span><span class="sw" style="background:var(--c-a)"></span>A 由来</span><span><span class="sw" style="background:var(--c-b)"></span>A⁻¹ 由来</span><span><span class="sw" style="background:var(--c-w)"></span>積（単位行列）</span>`;
      }
      read+='<br><span style="color:var(--text-secondary)">積のマスを押すと、使う行と列が切り替わる</span>';
      cv.style.cursor='pointer';
    }
    legend+=step>=2?'<span>破線　入れ替えの軸</span>':'';
    $('it-chain').innerHTML=chain;$('it-chain').hidden=step>=2;
    $('it-read').innerHTML=read;$('it-legend').innerHTML=legend;
  }
  function setStep(n){step=Math.max(0,Math.min(3,n));sIn.max=step<2?'2':'1';sIn.value=0;update();}
  $('it-next').onclick=()=>setStep(step+1);
  $('it-prev').onclick=()=>setStep(step-1);
  $('it-rand').onclick=()=>{
    const r=()=>Math.floor(Math.random()*5)-2;
    const pick=()=>{for(;;){const M=[[r(),r()],[r(),r()]];if(Math.abs(det(M))===1&&!same(M,I))return M;}};
    for(;;){A=pick();B=pick();if(mul(A,B).flat().every(v=>Math.abs(v)<=4))break;}
    computeView();sIn.value=0;update();
  };
  sIn.oninput=update;
  cv.addEventListener('pointerdown',e=>{
    if(step<2||!geom)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
    let best=null,bd=1e9;geom.forEach(g=>{const d=Math.hypot(g.ctr[0]-x,g.ctr[1]-y);if(d<bd){bd=d;best=g;}});
    if(best&&bd<Math.min(b.width,b.height)/8){sel=[best.r,best.q];update();}
  });
  cv.addEventListener('keydown',e=>{
    if(step<2)return;const m={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[e.key];if(!m)return;
    e.preventDefault();sel=[(sel[0]+m[0]+2)%2,(sel[1]+m[1]+2)%2];update();
  });
  window.addEventListener('resize',()=>{if(!pages['inverse-transpose'].hidden)update();});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!pages['inverse-transpose'].hidden)update();});}catch(e){}
  computeView();
  return{show:()=>{setStep(step);}};
})();

/* 最初に開くページ */
go(({'gram-schmidt':1,'inverse-transpose':1})[location.hash.slice(1)]?location.hash.slice(1):'home');
</script>

</body></html>
